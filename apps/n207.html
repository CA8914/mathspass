<title>N207 · Divisible par 2, 5, 10, 100</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

<body>
<main id="app"></main>
<footer class="note">Application créée par intelligence artificielle (Claude), sur les consignes de C. Antonelli.</footer>
<script src="../shared/engine.js"></script>
<script>
{
const {R,pick,shuf,G}=MM;
const sum=n=>[...String(n)].reduce((a,b)=>a+ +b,0);
const RULE={
 2:{r:'Un nombre est divisible par 2 quand il se termine par 0, 2, 4, 6 ou 8. C\'est un nombre pair.',c:n=>{const u=n%10;return`${G(n)} se termine par ${u}.`}},
 5:{r:'Un nombre est divisible par 5 quand il se termine par 0 ou 5.',c:n=>`${G(n)} se termine par ${n%10}.`},
 10:{r:'Un nombre est divisible par 10 quand il se termine par 0.',c:n=>`${G(n)} se termine par ${n%10}.`},
 100:{r:'Un nombre est divisible par 100 quand il se termine par 00.',c:n=>`${G(n)} se termine par ${String(n%100).padStart(2,'0')}.`},
 3:{r:'Un nombre est divisible par 3 quand la somme de ses chiffres est divisible par 3.',c:n=>`${[...String(n)].join(' + ')} = ${sum(n)}.`},
 9:{r:'Un nombre est divisible par 9 quand la somme de ses chiffres est divisible par 9.',c:n=>`${[...String(n)].join(' + ')} = ${sum(n)}.`},
 4:{r:'Un nombre est divisible par 4 quand ses 2 derniers chiffres forment un nombre divisible par 4.',c:n=>`Les 2 derniers chiffres : ${String(n%100).padStart(2,'0')}.`},
 25:{r:'Un nombre est divisible par 25 quand il se termine par 00, 25, 50 ou 75.',c:n=>`${G(n)} se termine par ${String(n%100).padStart(2,'0')}.`}};
const HINT={2:'Regarde le dernier chiffre. Est-il pair ?',5:'Regarde le dernier chiffre : 0 ou 5 ?',10:'Regarde le dernier chiffre : est-ce 0 ?',100:'Regarde les 2 derniers chiffres : est-ce 00 ?',
 3:'Additionne tous les chiffres du nombre.',9:'Additionne tous les chiffres du nombre.',4:'Regarde les 2 derniers chiffres.',25:'Regarde les 2 derniers chiffres : 00, 25, 50 ou 75 ?'};
/* un nombre divisible (ou pas) par d, avec des pièges proches */
function make(d,yes,k){for(let g=0;g<500;g++){const n=R(Math.pow(10,k-1),Math.pow(10,k)-1);
 let m=n;if(yes)m=n-n%d||d;else if(Math.random()<.6){const near={2:[1,3,5,7,9],5:[1,2,3,4,6,7,8,9],10:[5,2,8],100:[50,10,20,5,90],3:[1,2],9:[3,6],4:[2,6,10,14,18,22],25:[5,10,20,30,40,45,15,35,55]}[d];m=n-n%(d>=25||d===100?100:10)+pick(near);if(d===3||d===9)m=n-(n%d)+pick(near)}
 if(m>=Math.pow(10,k-1)&&m<Math.pow(10,k)&&(m%d===0)===yes)return m}return yes?d*R(11,99):d*R(11,99)+1}
const qYN=(ds,k1,k2)=>()=>{const d=pick(ds),yes=Math.random()<.5,n=make(d,yes,R(k1,k2)),ok=n%d===0;
 return{big:`<div class="big">${G(n)}</div>`,text:['Regarde ce nombre.',`Est-ce qu'il est divisible par <b>${d}</b> ?`],kind:'choice',ans:ok?'o':'n',
 opts:[{l:'Oui',v:'o'},{l:'Non',v:'n'}],hint:HINT[d],ok:`${G(n)} ${ok?'est':'n\'est pas'} divisible par ${d}.`,
 ex:[RULE[d].r,RULE[d].c(n),`Donc ${G(n)} <b>${ok?'est':'n\'est pas'}</b> divisible par ${d}.`]}};
const qWhich=(ds,k1,k2)=>()=>{const d=pick(ds),k=R(k1,k2),good=make(d,true,k),bad=new Set();let g=0;while(bad.size<2&&g++<100){const b=make(d,false,k);if(b!==good)bad.add(b)}
 const all=shuf([good,...bad]);
 return{big:'',text:['Regarde les 3 nombres.',`Quel nombre est divisible par <b>${d}</b> ?`],kind:'choice',ans:good,opts:all.map(v=>({l:`<span style="font-size:28px">${G(v)}</span>`,v})),
 hint:HINT[d],ok:`${G(good)} est divisible par ${d}.`,ex:[RULE[d].r,...all.map(v=>RULE[d].c(v)+(v===good?' Oui !':' Non.')),`Le bon nombre est <b>${G(good)}</b>.`]}};
const MEMO1=`<p><b>Divisible</b> : la division tombe juste. Il n'y a pas de reste.</p><table class="memo-t"><tr><td>par 2</td><td>Le nombre se termine par 0, 2, 4, 6 ou 8. C'est un nombre pair. Exemple : 348.</td></tr><tr><td>par 10</td><td>Le nombre se termine par 0. Exemple : 570.</td></tr></table>`;
const MEMO2=`<p><b>Divisible</b> : la division tombe juste. Il n'y a pas de reste.</p><table class="memo-t"><tr><td>par 2</td><td>Se termine par 0, 2, 4, 6 ou 8.</td></tr><tr><td>par 5</td><td>Se termine par 0 ou 5. Exemple : 3 415.</td></tr><tr><td>par 10</td><td>Se termine par 0. Exemple : 12 340.</td></tr><tr><td>par 100</td><td>Se termine par 00. Exemple : 45 700.</td></tr></table><p style="margin-top:8px">Divisible par 100 → aussi par 10, par 5 et par 2.</p>`;
const MEMO3=`<p><b>Divisible</b> : la division tombe juste. Il n'y a pas de reste.</p><table class="memo-t"><tr><td>par 3</td><td>La somme des chiffres est divisible par 3. 372 : 3 + 7 + 2 = 12. Oui.</td></tr><tr><td>par 9</td><td>La somme des chiffres est divisible par 9. 459 : 4 + 5 + 9 = 18. Oui.</td></tr><tr><td>par 4</td><td>Les 2 derniers chiffres font un nombre divisible par 4. 1 324 : 24. Oui.</td></tr><tr><td>par 25</td><td>Se termine par 00, 25, 50 ou 75. 3 475. Oui.</td></tr></table>`;
MM.run({code:'N207',title:'Divisible par 2, 5, 10, 100',
 desc:['Tu regardes un nombre.','Tu dis s\'il est divisible par 2, 5, 10 ou 100.','Divisible veut dire : la division tombe juste, sans reste.'],
 icon:'<svg viewBox="0 0 120 120" role="img" aria-label="Un signe diviser"><circle cx="60" cy="60" r="56" fill="var(--yel)"/><circle cx="60" cy="36" r="8" fill="var(--coral)"/><circle cx="60" cy="84" r="8" fill="var(--coral)"/><path d="M30 60h60" stroke="var(--coral)" stroke-width="12" stroke-linecap="round"/></svg>',
 memo:`<p><b>Divisible</b> : la division tombe juste. Il n'y a pas de reste.</p><table class="memo-t"><tr><td>par 2</td><td>Le nombre se termine par 0, 2, 4, 6 ou 8 (nombre pair).</td></tr><tr><td>par 5</td><td>Le nombre se termine par 0 ou 5.</td></tr><tr><td>par 10</td><td>Le nombre se termine par 0.</td></tr><tr><td>par 100</td><td>Le nombre se termine par 00.</td></tr><tr><td>par 3</td><td>La somme des chiffres est divisible par 3.</td></tr><tr><td>par 9</td><td>La somme des chiffres est divisible par 9.</td></tr><tr><td>par 4</td><td>Les 2 derniers chiffres font un nombre divisible par 4.</td></tr><tr><td>par 25</td><td>Le nombre se termine par 00, 25, 50 ou 75.</td></tr></table>`,
 levels:[
 {t:'Niveau 1',memo:MEMO1,s:'Divisible par 2 et par 10',comp:'tables, phase 1 (N107, N110)',teach:'nombres pairs et divisibles par 10, nombres de 2 à 3 chiffres.',g:[qYN([2,10],2,3),qYN([2],2,3),qWhich([2,10],2,3)]},
 {t:'Niveau 2',memo:MEMO2,s:'Divisible par 2, 5, 10, 100',comp:'N207, phase 2',teach:'caractères de divisibilité par 2, 5, 10, 100 sur des nombres jusqu\'à 6 chiffres.',g:[qYN([2,5,10,100],3,6),qYN([5,100],3,6),qWhich([2,5,10,100],3,6)]},
 {t:'Niveau 3',memo:MEMO3,s:'Divisible par 3, 4, 9, 25',comp:'dépassement',teach:'caractères de divisibilité par 3, 9 (somme des chiffres), 4 et 25 (deux derniers chiffres).',g:[qYN([3,9],3,5),qYN([4,25],3,5),qWhich([3,4,9,25],3,5)]}]});

}
